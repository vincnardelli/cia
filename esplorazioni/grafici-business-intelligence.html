<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafici e Business Intelligence</title>
<style>
  :root{--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--soft:#f8fafc;--p1:#2563eb;--p2:#059669;--p3:#7c3aed;--bar:rgba(31,41,55,.07)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;padding:12px 14px;font-size:14px;line-height:1.45}
  [hidden]{display:none!important}
  .row{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
  .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
  label{display:flex;gap:8px;align-items:center}
  select{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  select:disabled{color:var(--muted);background:var(--soft)}
  /* schede in alto, come le tab della pagina modulo */
  .modi{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 12px}
  .modi a{padding:8px 14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;color:var(--ink)}
  .modi a:hover{border-color:var(--line)}
  .modi a.on{border-color:var(--p2);color:var(--p2)}
  /* pillole, come i tag del sito */
  .viste{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
  .viste button,.chip{font:inherit;font-size:12.5px;font-weight:600;line-height:1;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 10px;cursor:pointer}
  .viste button b{color:var(--muted);margin-right:3px}
  .viste button.on{border-color:var(--p2);background:var(--p2);color:#fff}
  .viste button.on b{color:#a7f3d0}
  .legenda{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;gap:6px;align-items:center;padding:4px 9px;font-weight:500}
  .chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .chip.off{opacity:.4}
  .chip.fermo{cursor:default}
  .opts{min-height:28px;justify-content:space-between}
  .opts input[type=range]{width:160px}
  .chart{position:relative}
  svg{width:100%;height:auto;display:block;overflow:visible}
  .tick{font-size:11px;fill:var(--muted)}
  .axt{font-size:12px;fill:var(--ink);font-weight:600}
  .lab{font-size:11.5px;fill:var(--ink)}
  .labm{font-size:11px;fill:var(--muted)}
  .fade{animation:fade .45s ease .4s both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .pt .hit{fill:transparent;cursor:pointer}
  .pt .d{stroke:#fff;stroke-width:.8}
  .tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.1);display:none;white-space:nowrap;z-index:2}
  .tip .c{color:var(--muted)}
  /* riquadri, come .concetti__col e .via */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
  .card{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fff}
  .card p{margin:4px 0 0}
  .card.si{background:#ecfdf5;border-color:#a7f3d0}
  .card.si .k{color:var(--p2)}
  .card.no{background:var(--soft)}
  /* casi: come le schede lab */
  .casi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
  .caso{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05);text-align:left;font:inherit;color:var(--ink)}
  .caso:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .caso.sk{border-left-color:var(--p1)} .caso.ku{border-left-color:var(--p3)}
  .caso.on{background:var(--soft);border-color:var(--ink);border-left-color:var(--ink)}
  .caso .k{font-size:10.5px} .caso.sk .k{color:var(--p1)} .caso.ku .k{color:var(--p3)}
  .caso .t{font-weight:700;font-size:13.5px;margin-top:2px}
  .domanda{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--soft);margin:0 0 10px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .domanda .q{font-size:15.5px;font-weight:600;max-width:640px}
  .passi{display:flex;gap:5px}
  .passi span{width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:700;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
  .passi span.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .risposta{margin-top:10px;border:1px solid #a7f3d0;background:#ecfdf5;border-radius:10px;padding:10px 14px}
  .risposta .k{color:var(--p2)}
  .risposta p{margin:4px 0 0}
  /* tabella delle misure */
  .tabwrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
  th,td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  tr:last-child td{border-bottom:none}
  th{background:var(--soft);font-weight:600;vertical-align:bottom}
  th:first-child,td:first-child{text-align:left}
  th button{font:inherit;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 7px;cursor:pointer;display:inline-flex;gap:4px;align-items:center;color:var(--ink)}
  th button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  th button svg{width:14px;height:8px}
  th span.k{display:inline-block;padding:3px 0}
  td i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
  th.on,td.on{background:#fef3c7}
  .nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .btn{font:inherit;font-weight:700;border:1px solid var(--p2);background:var(--p2);color:#fff;border-radius:8px;padding:7px 13px;cursor:pointer}
  .btn:disabled{opacity:.35;cursor:default}
  .hint{color:var(--muted);font-size:13px}
  @media (max-width:700px){.cards{grid-template-columns:1fr}.casi{grid-template-columns:1fr 1fr}}
</style></head><body>

function num(v,d){const neg=v<0;let [a,b]=(Math.round(Math.abs(v)*10**d+1e-7)/10**d).toFixed(d).split('.');a=a.replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (neg?'−':'')+a+(b?','+b:'');}
function fmt(v,V,d){d=d??V.d;let n=num(v,d);if(d>V.d)n=n.replace(/(,\d*?)0+$/,'$1').replace(/,$/,'');
  if(n==='1'){const s={giorni:'giorno',stelle:'stella',pezzi:'pezzo'}[V.u];if(s)return '1 '+s;}
  return V.u==='€'?n+' €':V.u==='%'?n+' %':V.u?n+' '+V.u:n;}
function tick(v,max){if(max>=10000&&v)return num(v/1000,v%1000?1:0)+'k';const d=Math.abs(v-Math.round(v))<1e-9?0:Math.abs(v*10-Math.round(v*10))<1e-9?1:2;return num(v,d);}
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function niceMax(max){let step=niceStep(max/8);while(Math.ceil(max/step-1e-9)>7)step=niceStep(step*1.01);return {max:Math.ceil(max/step-1e-9)*step,step};}
function quant(s,p){const h=(s.length-1)*p,lo=Math.floor(h);return s[lo]+(h-lo)*((s[lo+1]??s[lo])-s[lo]);}
function stats(vals){
  const s=[...vals].sort((a,b)=>a-b),n=s.length,mean=s.reduce((a,b)=>a+b,0)/n;
  let m2=0,m4=0;for(const x of s){const d=x-mean;m2+=d*d;m4+=d**4;}
  const sd=Math.sqrt(m2/(n-1));
  const sk=n>2&&sd>0?n/((n-1)*(n-2))*s.reduce((a,x)=>a+((x-mean)/sd)**3,0):0;
  const k=m2>0?(m4/n)/((m2/n)**2)-3:0;
  const q1=quant(s,.25),med=quant(s,.5),q3=quant(s,.75),iqr=q3-q1,lof=q1-1.5*iqr,hif=q3+1.5*iqr;
  return {n,s,min:s[0],max:s[n-1],mean,sd,sk,k,q1,med,q3,iqr,lof,hif,p95:quant(s,.95),
    wlo:Math.min(...s.filter(x=>x>=lof)),whi:Math.max(...s.filter(x=>x<=hif))};
}
function corr(a,b){const n=a.length,ma=a.reduce((x,y)=>x+y)/n,mb=b.reduce((x,y)=>x+y)/n;let sab=0,saa=0,sbb=0;
  for(let i=0;i<n;i++){sab+=(a[i]-ma)*(b[i]-mb);saa+=(a[i]-ma)**2;sbb+=(b[i]-mb)**2;}
  return {r:sab/Math.sqrt(saa*sbb),b:sab/saa,a:mb-sab/saa*ma};}

function ctx(){
  const ds=DS[S.ds],V=ds.vars[S.v],vals=ds.rows.map(r=>r.v[S.v]),st=stats(vals);
  const dom=niceMax(V.discreta?st.max+.5:st.max),Y=v=>YB-v/dom.max*PH;
  const groups=ds.groups.map((g,k)=>{const ix=ds.rows.map((r,i)=>i).filter(i=>ds.rows[i].g===k);return {...g,k,ix,st:stats(ix.map(i=>vals[i]))};});
  const gap=40,np=ds.panels?groups.length:1,pw=(PW-gap*(np-1))/np;
  const panels=ds.panels?groups.map((g,k)=>({...g,x0:X0+k*(pw+gap),w:pw})):[{ix:vals.map((v,i)=>i),st,x0:X0,w:PW}];
  const order=vals.map((v,i)=>i).sort((a,b)=>vals[a]-vals[b]||a-b);
  const c={ds,V,vals,st,dom,Y,groups,panels,f:(v,d)=>fmt(v,V,d),imax:order[order.length-1],imin:order[0]};
  c.who=i=>`<b>${ds.rows[i].id}</b> (${ds.panels?ds.rows[i].sub:CATS[ds.rows[i].g]})`;
  c.g=n=>groups.find(g=>g.n===n);
  return c;
}
function binWidths(max){const out=[];for(let e=-2;e<=6;e++)for(const m of [1,2,2.5,5]){const w=m*10**e,nb=Math.ceil(max/w);if(nb>=3&&nb<=40)out.push(w);}return out;}

function boxSvg(cx,w,st,Y){
  const h=w/2,cap=w*.22,s='stroke="#374151" stroke-width="1.5"';
  return `<line x1="${cx}" x2="${cx}" y1="${Y(st.whi)}" y2="${Y(st.q3)}" ${s}/><line x1="${cx}" x2="${cx}" y1="${Y(st.q1)}" y2="${Y(st.wlo)}" ${s}/>
  <line x1="${cx-cap}" x2="${cx+cap}" y1="${Y(st.whi)}" y2="${Y(st.whi)}" ${s}/><line x1="${cx-cap}" x2="${cx+cap}" y1="${Y(st.wlo)}" y2="${Y(st.wlo)}" ${s}/>
  <rect x="${cx-h}" y="${Y(st.q3)}" width="${w}" height="${Math.max(1,Y(st.q1)-Y(st.q3))}" rx="3" style="fill:rgba(255,255,255,.45)" ${s}/>
  <line x1="${cx-h}" x2="${cx+h}" y1="${Y(st.med)}" y2="${Y(st.med)}" stroke="#111827" stroke-width="3"/>`;
}
function spread(ys,gap){ // allontana le etichette troppo vicine, verso l'alto
  const o=ys.map((y,i)=>({y,i})).sort((a,b)=>b.y-a.y);
  for(let k=1;k<o.length;k++)if(o[k-1].y-o[k].y<gap)o[k].y=o[k-1].y-gap;
  const r=[];o.forEach(e=>r[e.i]=e.y);return r;
}

    const bin=c.vals.map(v=>c.V.discreta?bins.findIndex(b=>b.mid===Math.round(v)):(v<=0?0:Math.min(bins.length-1,Math.ceil(v/w-1e-9)-1)));
    const cnt=c.panels.map(p=>{const k=Array(bins.length).fill(0);p.ix.forEach(i=>k[bin[i]]++);return k;});
    const mc=Math.max(...cnt.flat()),bpx=PH*(bins[0].hi-bins[0].lo)/c.dom.max-2,avail=c.panels[0].w-30;
    // quante righe di punti per fascia: la più comoda per farci stare la pila più lunga
    let best={s:0,rows:1};for(let rows=1;rows<=12;rows++){const s=Math.min(15,avail/Math.ceil(mc/rows),bpx/rows);if(s>best.s+.3)best={s,rows};}
    c.h={w,bins,bin,cnt,mc,bpx,...best,r:Math.max(1.2,Math.min(5,best.s/2-.5))};},
  pos:c=>{const r=[],{s,rows}=c.h;
    c.panels.forEach(p=>{const seen={};[...p.ix].sort((a,b)=>c.ds.rows[a].g-c.ds.rows[b].g||a-b).forEach(i=>{const b=c.h.bin[i],j=(seen[b]=(seen[b]||0)+1)-1;
      r[i]={x:p.x0+(Math.floor(j/rows)+.5)*s,y:c.Y(c.h.bins[b].mid)+((j%rows)-(rows-1)/2)*s,r:c.h.r};});});return r;},
  over:c=>c.panels.map((p,pi)=>c.h.cnt[pi].map((n,b)=>{if(!n)return '';const bn=c.h.bins[b],y0=c.Y(bn.hi)+1,hh=Math.max(1,c.Y(bn.lo)-c.Y(bn.hi)-2),w=Math.ceil(n/c.h.rows)*c.h.s;
    return `<rect x="${p.x0}" y="${y0}" width="${w}" height="${hh}" rx="3" style="fill:var(--bar)"/>`+(c.h.bins.length<=16?`<text class="labm" x="${p.x0+w+5}" y="${y0+hh/2+4}">${n}</text>`:'');}).join('')).join(''),
  xax:c=>{const step=niceStep(c.h.mc/(c.ds.panels?3:5));return c.panels.map(p=>{let t='';for(let v=0;v<=c.h.mc;v+=step)t+=`<text class="tick" x="${p.x0+v/c.h.rows*c.h.s}" y="${YB+16}" text-anchor="middle">${v}</text>`;return t;}).join('')+xLabel(`numero di ${c.ds.plur} nella fascia`);},
  opts:c=>c.V.discreta?'':`<label><span class="k">Larghezza delle fasce</span><input type="range" id="bw" min="0" max="${c.ws.length-1}" step="1" value="${c.ws.indexOf(c.h.w)}"><b>${c.f(c.h.w,c.h.w<1?2:c.h.w%1?1:0)}</b></label>`,
  vede:c=>{if(c.ds.panels)return `I punti cadono verso sinistra e si impilano: ogni barra conta i ${c.ds.plur} della sua fascia, separatamente per ${c.groups.map(g=>g.n).join(' e ')}. Si confrontano le <b>forme</b>.`;
    const m=c.h.cnt[0].indexOf(c.h.mc),b=c.h.bins[m],sk=c.st.sk;
    return `I punti cadono verso sinistra e si impilano per fasce larghe ${c.f(c.h.w,c.h.w<1?2:c.h.w%1?1:0)}: ogni barra conta i prodotti della sua fascia, e i colori restano attaccati ai prodotti. La più affollata va da ${c.f(b.a,c.V.d)} a ${c.f(b.b,c.V.d)}, con ${c.h.mc} prodotti su 80. Si vede la <b>forma</b>: ${sk>.5?'una coda lunga verso l\'alto, pochi prodotti con valori molto grandi':sk<-.5?'una coda verso il basso, pochi prodotti con valori molto piccoli':'abbastanza simmetrica'}.`;},
  perde:c=>`Quale ${c.ds.sing} è quale: i punti ci sono ancora (passaci sopra), ma ora la posizione orizzontale dice solo «quanti». ${c.V.discreta?'':'E la forma dipende dalla larghezza delle fasce: prova a cambiarla.'}`},

boxplot:{t:()=>'Boxplot',
  pos:c=>{const r=[];c.panels.forEach(p=>{const cx=p.x0+p.w*.5,a=Math.min(80,p.w*.22);
    p.ix.forEach(i=>{const v=c.vals[i],out=v<p.st.lof||v>p.st.hif;r[i]={x:cx+jit(i)*(out?a*.12:a),y:c.Y(v),o:S.pts.boxplot||out?1:0};});});return r;},
  over:c=>c.panels.map(p=>boxSvg(p.x0+p.w*.5,Math.min(200,p.w*.6),p.st,c.Y)).join(''),
  xax:c=>'',
  opts:c=>`<label><input type="checkbox" id="pts" ${S.pts.boxplot?'checked':''}> mostra tutti i punti</label>`,
  vede:c=>{const no=c.panels.reduce((a,p)=>a+p.ix.filter(i=>c.vals[i]<p.st.lof||c.vals[i]>p.st.hif).length,0);
    return `Cinque numeri al posto di ${c.vals.length}. La scatola va da Q1 a Q3 e contiene metà dei ${c.ds.plur}; la riga spessa è la mediana; i baffi arrivano all'ultimo valore entro 1,5 volte lo scarto interquartile${c.ds.panels?'':` (IQR = ${c.f(c.st.iqr,c.V.ds)})`}. ${no?`${no===1?'Un valore resta':no+' valori restano'} oltre i baffi, come punt${no===1?'o isolato':'i isolati'}.`:'Nessun valore va oltre i baffi.'}`;},
  perde:c=>{if(c.ds.panels)return 'La forma dentro la scatola, e il tempo. Togli i punti per vedere il boxplot da solo, e accendi la media nella tabella.';
    const m=c.st.mean,md=c.st.med,gap=(m-md)/c.st.sd;
    return `La forma dentro la scatola: un gruppo compatto e due gruppi separati possono dare la stessa scatola. Togli i punti per vedere il boxplot da solo. Manca anche la media, ${c.f(m,c.V.ds)}: ${Math.abs(gap)<.1?'qui è quasi uguale alla mediana':gap>0?'qui sta sopra la mediana, tirata su dai valori più grandi':'qui sta sotto la mediana, tirata giù dai valori più piccoli'}.`;}},

medie:{t:()=>'Medie per categoria',under:true,
  pos:c=>c.vals.map((v,i)=>({x:colX(c.ds.rows[i].g)+jit(i)*colW*.28,y:c.Y(v),o:S.pts.medie?1:0,r:4})),
  over:c=>c.groups.map((g,k)=>{const x=colX(k),w=colW*.7,y=c.Y(g.st.mean);
    return `<rect x="${x-w/2}" y="${y}" width="${w}" height="${YB-y}" rx="4" style="fill:${g.c};fill-opacity:.18"/><line x1="${x-w/2}" x2="${x+w/2}" y1="${y}" y2="${y}" stroke="${g.c}" stroke-width="3"/><text class="lab" x="${x}" y="${y-7}" text-anchor="middle" font-weight="700">${c.f(g.st.mean,c.V.d)}</text>`;}).join(''),
  xax:catAxis,
  opts:c=>`<label><input type="checkbox" id="pts" ${S.pts.medie?'checked':''}> mostra i prodotti dentro le colonne</label>`,
  vede:c=>{const s=[...c.groups].sort((a,b)=>b.st.mean-a.st.mean);
    return `Un numero per categoria: la media. ${s[0].n} ha la media più alta (${c.f(s[0].st.mean,c.V.ds)}), ${s[4].n} la più bassa (${c.f(s[4].st.mean,c.V.ds)}). Il confronto si legge in un attimo.`;},
  perde:c=>{const ns=c.groups.map(g=>g.ix.length);
    return `Tutto il resto. Ogni colonna riassume da ${Math.min(...ns)} a ${Math.max(...ns)} prodotti diversi e non dice se sono simili o sparsi, né se la media è tirata da pochi casi estremi. ${S.pts.medie?'Ora i prodotti si vedono: confronta quanto sono sparsi da una colonna all\'altra, poi passa al boxplot.':'Accendi i prodotti, o passa al boxplot per categoria.'}`;}},

boxcat:{t:()=>'Boxplot per categoria',
  pos:c=>{const r=[];c.groups.forEach((g,k)=>g.ix.forEach(i=>{const v=c.vals[i],out=v<g.st.lof||v>g.st.hif;r[i]={x:colX(k)+jit(i)*colW*(out?.04:.22),y:c.Y(v),o:S.pts.boxcat||out?1:0,r:4};}));return r;},
  over:c=>c.groups.map((g,k)=>boxSvg(colX(k),colW*.55,g.st,c.Y)).join(''),
  xax:catAxis,
  opts:c=>`<label><input type="checkbox" id="pts" ${S.pts.boxcat?'checked':''}> mostra tutti i punti</label>`,
  vede:c=>{const md=[...c.groups].sort((a,b)=>b.st.med-a.st.med),iq=[...c.groups].sort((a,b)=>a.st.iqr-b.st.iqr);
    return `I punti si separano per colore: ogni categoria diventa una scatola, sulla stessa scala. La mediana più alta è di ${md[0].n} (${c.f(md[0].st.med,c.V.ds)}); ${iq[0]===md[0]?'la sua è anche la scatola più stretta':`la scatola più stretta è quella di ${iq[0].n}`} (IQR ${c.f(iq[0].st.iqr,c.V.ds)}), cioè prodotti simili tra loro, la più larga quella di ${iq[4].n} (IQR ${c.f(iq[4].st.iqr,c.V.ds)}).`;},
  perde:c=>{const byMean=[...c.groups].sort((a,b)=>b.st.mean-a.st.mean).map(g=>g.n),byMed=[...c.groups].sort((a,b)=>b.st.med-a.st.med).map(g=>g.n);
    return `La media, e quanti prodotti ci sono dietro ogni scatola. Accendi la <b>media</b> nella tabella: ${byMean.join()!==byMed.join()?'la classifica per media non è la stessa di quella per mediana, perché pochi prodotti estremi spostano la media.':'qui la classifica per media è la stessa di quella per mediana.'}`;}},

dispersione:{t:()=>'Due variabili',
  setup:c=>{if(!S.xv||S.xv===S.v)S.xv=c.V.x;const XV=c.ds.vars[S.xv],xs=c.ds.rows.map(r=>r.v[S.xv]),xd=niceMax(Math.max(...xs));
    c.s={XV,xs,xd,X:v=>X0+v/xd.max*PW,cr:corr(xs,c.vals)};},
  pos:c=>c.vals.map((v,i)=>({x:c.s.X(c.s.xs[i]),y:c.Y(v)})),
  over:c=>{const {X,xs,cr}=c.s,lo=Math.min(...xs),hi=Math.max(...xs),cl=v=>Math.max(M.t,Math.min(YB,v));
    return `<line x1="${X(lo)}" x2="${X(hi)}" y1="${cl(c.Y(cr.a+cr.b*lo))}" y2="${cl(c.Y(cr.a+cr.b*hi))}" stroke="#111827" stroke-width="1.5" stroke-dasharray="6 4" opacity=".7"/>
    <text class="axt" x="${X0+PW-4}" y="${M.t-10}" text-anchor="end" font-size="15">r = ${num(cr.r,2)}</text>`;},
  xax:c=>{const {xd,X,XV}=c.s;let t='';for(let v=0;v<=xd.max+1e-9;v+=xd.step)t+=`<line x1="${X(v)}" x2="${X(v)}" y1="${YB}" y2="${YB+4}" stroke="#9ca3af"/><text class="tick" x="${X(v)}" y="${YB+16}" text-anchor="middle">${tick(v,xd.max)}</text>`;
    return t+xLabel(`${XV.lab}${XV.u?' ('+XV.u+')':''}`);},
  opts:c=>`<label><span class="k">In orizzontale</span><select id="xv">${Object.entries(c.ds.vars).filter(([k])=>k!==S.v).map(([k,v])=>`<option value="${k}" ${k===S.xv?'selected':''}>${v.lab}</option>`).join('')}</select></label>`,
  vede:c=>{const r=c.s.cr.r,a=Math.abs(r),dir=r>0?'sale':'scende';
    return `Ogni prodotto ha due coordinate: ${c.V.lab.toLowerCase()} in verticale, come in tutti gli altri grafici, e ${c.s.XV.lab.toLowerCase()} in orizzontale. La correlazione è <b>r = ${num(r,2)}</b>: ${a>=.7?`i punti stanno vicino a una retta che ${dir}`:a>=.4?`una tendenza c'è (la retta ${dir}), ma con molta dispersione`:a>=.2?`una tendenza debole, la nuvola ha poca direzione`:`nessuna relazione lineare, una nuvola senza direzione`}.`;},
  perde:c=>`La distribuzione di ciascuna variabile presa da sola. E la correlazione dice che due variabili si muovono insieme, non quale delle due muove l'altra.`}
};

const pct=x=>num(100*x,1).replace(/,0$/,'')+' %';
const CASI=[

  {view:'boxcat',met:['mean','med'],txt:c=>{const idx=c.vals.map((v,i)=>i).sort((a,b)=>c.vals[b]-c.vals[a]).slice(0,5),cats=[...new Set(idx.map(i=>CATS[c.ds.rows[i].g]))];

{tag:'Skewness',cl:'sk',t:'Su quali prodotti intervenire?',ds:'catalogo',v:'valutazione_clienti',

{tag:'Curtosi',cl:'ku',t:'Quante scorte tenere?',ds:'domanda',v:'unita',

 passi:[
  {view:'indice',met:['mean','sd2'],txt:c=>{const s=c.g('Smartphone');
    return `Un anno di vendite, giorno per giorno. Stessa media, stessa deviazione standard, quindi la stessa banda media ± 2 dev. std.: fino a ${c.f(Math.round(s.st.mean+2*s.st.sd))} al giorno. La pasta oscilla tranquilla; lo smartphone di solito resta sotto i 100 (${s.ix.filter(i=>c.vals[i]<100).length} giorni su 365), poi esplode.`;}},
  {view:'istogramma',met:['mean','sd2'],txt:c=>`Le stesse vendite come istogrammi. La pasta è una campana; lo smartphone ha una pila bassa e una coda di giorni enormi, fino a ${c.f(c.g('Smartphone').st.max)}.`},
  {view:'boxplot',met:['sd2','max'],on:['k'],txt:c=>`Nel boxplot i giorni oltre i baffi sono i picchi: guarda quanti ne ha lo smartphone, e quanto in alto.`,
   ris:c=>{const p=c.g('Pasta'),s=c.g('Smartphone'),soglia=g=>Math.round(g.st.mean+2*g.st.sd),oltre=g=>g.ix.filter(i=>c.vals[i]>soglia(g)).length;

{tag:'Curtosi',cl:'ku',t:'Che tempi di consegna promettere?',ds:'catalogo',v:'ritardo_fornitore_giorni',

 passi:[

  {view:'istogramma',met:['mean','med'],txt:c=>{const n=c.vals.filter(v=>v<=3).length,coda=c.vals.filter(v=>v>3);

  {view:'istogramma',met:['mean','p95'],on:['k'],txt:c=>`La linea marrone è il 95° percentile: il 95 % dei ritardi sta sotto.`,
   ris:c=>`<b>Curtosi = ${num(c.st.k,2)}</b>: code pesanti, i casi estremi sono rari ma enormi. Chi promette sulla media sbaglia proprio sui ${c.vals.filter(v=>v>3).length} prodotti più lenti. Si promette sul <b>95° percentile</b>, ${c.f(c.st.p95,1)}.`}]},
{tag:'Curtosi',cl:'ku',t:'Dove tagliare il costo di magazzino?',ds:'catalogo',v:'costo_magazzino',
 q:'Bisogna ridurre il costo di magazzino. Si tagliano un po\' le scorte di tutti i prodotti?',
 passi:[

  {view:'istogramma',met:['mean','med'],txt:c=>`L'istogramma: una pila enorme vicino a zero e qualche punto isolato molto in alto.`},
  {view:'fila',met:['mean'],on:['k'],txt:c=>`In fila: piatta per quasi tutto il catalogo, poi sale a picco negli ultimi prodotti.`,

// ── disegno ──
const svg=document.getElementById('svg'),tip=document.getElementById('tip'),$=id=>document.getElementById(id);
svg.innerHTML=`<g id="yax"></g><g id="under"></g><g id="pts"></g><g id="over"></g><g id="met"></g><g id="xax"></g><g id="pin"></g>`;
const G=id=>svg.querySelector('#'+id);
let P=[],Pds=null,C,anim;
function buildPoints(){
  const ds=DS[S.ds];G('pts').innerHTML='';
  P=ds.rows.map((r,i)=>{const g=document.createElementNS(NS,'g');g.setAttribute('class','pt');
    g.innerHTML=`<circle class="d" r="${ds.r}"/><circle class="hit" r="${Math.max(6,ds.r+4)}"/>`;G('pts').appendChild(g);
    g.addEventListener('mouseenter',()=>showTip(i));g.addEventListener('mouseleave',()=>tip.style.display='none');
    g.addEventListener('click',()=>{S.pin=S.pin===i?-1:i;drawPin();});
    return {g,dot:g.firstChild,x:null,y:null,r:ds.r,o:0};});
  Pds=S.ds;
}
function render(move=true){
  if(Pds!==S.ds)buildPoints();
  C=ctx();const v=VIEWS[S.view];v.setup&&v.setup(C);
  const T=v.pos(C).map(p=>({x:p.x,y:p.y,r:p.r??C.ds.r,o:p.o??1}));
  // asse verticale: non cambia mai tra un grafico e l'altro
  let ya=`<text class="axt" x="${X0-8}" y="${M.t-28}">${C.V.lab}${C.V.u?' ('+C.V.u+')':''} ↑</text>`;
  for(let t=0;t<=C.dom.max+1e-9;t+=C.dom.step)ya+=`<line x1="${X0}" x2="${X0+PW}" y1="${C.Y(t)}" y2="${C.Y(t)}" stroke="${t?'#f1f2f4':'#9ca3af'}"/><text class="tick" x="${X0-8}" y="${C.Y(t)+4}" text-anchor="end">${tick(t,C.dom.max)}</text>`;
  G('yax').innerHTML=ya;
  const ov=v.over?v.over(C):'';G('under').innerHTML=v.under?`<g class="fade">${ov}</g>`:'';G('over').innerHTML=v.under?'':`<g class="fade">${ov}</g>`;
  G('xax').innerHTML=`<g class="fade">${panelTitles(C)}${v.xax(C)}</g>`;
  drawMetrics();
  $('opts').innerHTML=v.opts?v.opts(C):'';bindOpts();
  drawLegend();drawTable();drawText();colorPts();
  // animazione: ogni punto va dalla posizione attuale a quella nuova
  cancelAnimationFrame(anim);
  const from=P.map((p,i)=>p.x===null?{...T[i],o:0}:{x:p.x,y:p.y,r:p.r,o:p.o}),t0=performance.now(),dur=move?750:0,lag=Math.min(3,240/P.length);
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  (function step(now){let done=true;
    P.forEach((p,i)=>{const t=dur?Math.max(0,Math.min(1,(now-t0-i*lag)/dur)):1;if(t<1)done=false;const e=ease(t),a=from[i],b=T[i];
      p.x=a.x+(b.x-a.x)*e;p.y=a.y+(b.y-a.y)*e;p.r=a.r+(b.r-a.r)*e;p.o=a.o+(b.o-a.o)*e;
      p.g.setAttribute('transform',`translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);p.dot.setAttribute('r',p.r.toFixed(2));
      p.g.style.opacity=p.o.toFixed(2);p.g.style.pointerEvents=b.o>0?'auto':'none';});
    drawPin();if(!done)anim=requestAnimationFrame(step);})(t0);
}
// linee delle misure: su tutto il pannello, o su ogni colonna nel boxplot per categoria
function drawMetrics(){
  const v=S.view,ms=MET.filter(m=>S.met.has(m.k));if(!ms.length){G('met').innerHTML='';return;}
  const units=v==='boxcat'||v==='medie'?C.groups.map((g,k)=>({x0:colX(k)-colW*.42,x1:colX(k)+colW*.42,st:g.st,n:g.ix.length,stretta:true})):
    v==='dispersione'?[{x0:X0,x1:X0+PW,st:C.st,n:C.vals.length}]:C.panels.map(p=>({x0:p.x0,x1:p.x0+p.w,st:p.st,n:p.ix.length}));
  let h='';
  units.forEach((u,ui)=>{const lines=[];
    ms.forEach(m=>{const vals=m.k==='sd2'?[u.st.mean+2*u.st.sd,u.st.mean-2*u.st.sd].filter(x=>x>=0):[u.st[m.k]];
      vals.forEach((val,j)=>lines.push({m,val,lab:m.k==='sd2'?(j?'media − 2 s':'media + 2 s'):m.full}));});
    lines.forEach(l=>{const y=C.Y(l.val);h+=`<line x1="${u.x0}" x2="${u.x1}" y1="${y}" y2="${y}" stroke="${l.m.c}" stroke-width="${l.m.w}" stroke-dasharray="${l.m.da}"/>`;
      if(v==='fila'&&l.m.p!==undefined){const x=u.x0+((u.n-1)*l.m.p+.5)/u.n*(u.x1-u.x0);h+=`<line x1="${x}" x2="${x}" y1="${y}" y2="${YB}" stroke="${l.m.c}" stroke-width="1" stroke-dasharray="3 3"/>`;}});
    if(u.stretta&&ui>0)return;
    const ly=spread(lines.map(l=>C.Y(l.val)-4),13);
    lines.forEach((l,j)=>{const t=u.stretta?(l.m.k==='sd2'?(l.lab.includes('+')?'+2 s':'−2 s'):l.m.n):`${l.lab} = ${C.f(l.val,C.V.ds)}`;
      h+=`<text class="lab" x="${u.stretta?u.x0+2:u.x1-4}" y="${ly[j]}" text-anchor="${u.stretta?'start':'end'}" paint-order="stroke" stroke="#fff" stroke-width="3" style="fill:${l.m.c}" font-weight="600">${t}</text>`;});});
  G('met').innerHTML=h;
}
function colorPts(){const ds=DS[S.ds];P.forEach((p,i)=>{const g=ds.rows[i].g,dim=S.hl>=0&&g!==S.hl;p.dot.style.fill=dim?'#e5e7eb':ds.groups[g].c;});
  if(S.hl>=0)P.forEach((p,i)=>{if(ds.rows[i].g===S.hl)G('pts').appendChild(p.g);});}
function drawPin(){const g=G('pin');if(S.pin<0||!P[S.pin]){g.innerHTML='';return;}const p=P[S.pin],left=p.x>X0+PW*.8;
  g.innerHTML=`<g style="opacity:${p.o}"><circle cx="${p.x}" cy="${p.y}" r="${p.r+3.5}" fill="none" stroke="#111827" stroke-width="2"/>
  <text class="lab" font-weight="700" x="${p.x+(left?-12:12)}" y="${p.y-8}" text-anchor="${left?'end':'start'}" paint-order="stroke" stroke="#fff" stroke-width="3">${C.ds.rows[S.pin].id}</text></g>`;}
function showTip(i){const r=C.ds.rows[i];let h=`<b>${r.id}</b> <span class="c">· ${r.sub}</span><br>${C.V.lab}: <b>${C.f(C.vals[i])}</b>`;
  if(S.view==='dispersione')h+=`<br>${C.s.XV.lab}: <b>${fmt(C.s.xs[i],C.s.XV)}</b>`;
  if(S.view==='istogramma'&&!C.V.discreta){const b=C.h.bins[C.h.bin[i]];h+=`<br><span class="c">fascia ${C.f(b.a,C.V.d)} – ${C.f(b.b,C.V.d)}</span>`;}
  tip.innerHTML=h;tip.style.display='block';const box=svg.getBoundingClientRect(),k=box.width/W,p=P[i];
  let x=p.x*k+14,y=p.y*k-10;if(x+tip.offsetWidth>box.width)x=p.x*k-14-tip.offsetWidth;tip.style.left=Math.max(0,x)+'px';tip.style.top=Math.max(0,y)+'px';}
function drawLegend(){const ds=C.ds,click=!ds.panels;
  $('legenda').innerHTML=ds.groups.map((g,k)=>`<button class="chip ${click?'':'fermo'} ${S.hl>=0&&S.hl!==k?'off':''}" data-k="${k}" ${click?'title="evidenzia la categoria"':''}><i style="background:${g.c}"></i>${g.n}</button>`).join('');
  if(click)$('legenda').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;S.hl=S.hl===k?-1:k;drawLegend();drawTable();colorPts();});}
function swatch(m){return `<svg viewBox="0 0 18 8"><line x1="0" x2="18" y1="4" y2="4" stroke="currentColor" stroke-width="${Math.min(2.5,m.w+.5)}" stroke-dasharray="${m.da?m.da.split(' ').map(x=>x/2).join(' '):''}"/></svg>`;}
function drawTable(){
  const d=C.V.ds,rows=[];
  if(!C.ds.panels)rows.push({n:'Tutti i prodotti',st:C.st});
  const gs=C.ds.panels||S.view==='boxcat'||S.view==='medie'?C.groups:S.hl>=0?[C.groups[S.hl]]:[];
  gs.forEach(g=>rows.push({n:g.n,c:g.c,st:g.st}));
  const on=S.mode==='casi'?S.on:[];
  const cols=[...MET.map(m=>({k:m.k,m,v:st=>C.f(m.k==='sd2'?st.sd:st[m.k],d)})),{k:'sk',n:'Skewness',v:st=>num(st.sk,2)},{k:'k',n:'Curtosi',v:st=>num(st.k,2)}];
  $('metr').innerHTML=`<tr><th><span class="k">${C.ds.panels?'':'n = '+C.vals.length}</span></th>${cols.map(c=>`<th class="${on.includes(c.k)?'on':''}">${c.m?`<button data-k="${c.k}" class="${S.met.has(c.k)?'on':''}" title="mostra sul grafico: ${c.m.full}" style="${S.met.has(c.k)?'':'color:'+c.m.c}">${swatch(c.m)}${c.m.n}</button>`:`<span class="k">${c.n}</span>`}</th>`).join('')}</tr>`+
    rows.map(r=>`<tr><td>${r.c?`<i style="background:${r.c}"></i>`:''}${r.n}</td>${cols.map(c=>`<td class="${on.includes(c.k)?'on':''}">${c.v(r.st)}</td>`).join('')}</tr>`).join('');
  $('metr').querySelectorAll('th button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;S.met.has(k)?S.met.delete(k):S.met.add(k);drawMetrics();drawTable();});
}
function drawText(){
  const v=VIEWS[S.view];
  if(S.mode==='esplora'){$('vede').innerHTML=v.vede(C);$('perde').innerHTML=v.perde(C);}
  else{const caso=CASI[S.caso],p=caso.passi[S.passo];$('passo-k').textContent=`Passo ${S.passo+1} di ${caso.passi.length} · ${v.t(C.ds)}`;$('passo').innerHTML=p.txt(C);
    $('risposta-box').hidden=!p.ris;if(p.ris)$('risposta').innerHTML=p.ris(C);}
}
function bindOpts(){const bw=$('bw'),pts=$('pts'),xv=$('xv');
  if(bw)bw.oninput=()=>{S.bw[S.ds+S.v]=C.ws[+bw.value];render();};
  if(pts)pts.onchange=()=>{S.pts[S.view]=pts.checked;render();};
  if(xv)xv.onchange=()=>{S.xv=xv.value;render();};}

// ── controlli: esplora ──
const dsSel=$('ds'),varSel=$('var');
dsSel.innerHTML=Object.entries(DS).map(([k,d])=>`<option value="${k}">${d.nome}</option>`).join('');
function fillVars(){const ds=DS[S.ds];varSel.innerHTML=Object.entries(ds.vars).map(([k,v])=>`<option value="${k}" ${k===S.v?'selected':''}>${v.lab}</option>`).join('');varSel.disabled=Object.keys(ds.vars).length<2;}
function drawTabs(){const ds=DS[S.ds];$('viste').innerHTML=ds.viste.map((k,j)=>`<button data-v="${k}" class="${k===S.view?'on':''}"><b>${j+1}</b>${VIEWS[k].t(ds)}</button>`).join('');
  $('viste').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;drawTabs();render();});
  const i=ds.viste.indexOf(S.view);$('prev').disabled=i===0;$('next').disabled=i===ds.viste.length-1;
  $('prev').textContent='← Precedente';$('next').textContent='Successivo →';}
dsSel.onchange=()=>{S.ds=dsSel.value;S.v=DS[S.ds].def;S.hl=-1;S.pin=-1;S.xv=null;if(!DS[S.ds].viste.includes(S.view))S.view='indice';fillVars();drawTabs();render();};
varSel.onchange=()=>{S.v=varSel.value;S.xv=null;render();};

// ── controlli: domande di business ──
$('casi').innerHTML=CASI.map((c,k)=>`<button class="caso ${c.cl}" data-k="${k}"><div class="k">${c.tag}</div><div class="t">${c.t}</div></button>`).join('');
$('casi').querySelectorAll('.caso').forEach(b=>b.onclick=()=>apriCaso(+b.dataset.k,0));
function apriCaso(k,passo){
  const caso=CASI[k],p=caso.passi[passo];
  if(k!==S.caso||passo===0)S.pin=-1;
  Object.assign(S,{caso:k,passo,ds:caso.ds,v:caso.v,view:p.view,xv:p.xv||null,met:new Set(p.met),on:p.on||[],hl:-1});
  $('casi').querySelectorAll('.caso').forEach((b,j)=>b.classList.toggle('on',j===k));
  $('caso-k').innerHTML=`<span style="color:var(--${caso.cl==='sk'?'p1':'p3'})">Domanda · ${caso.tag}</span>`;$('caso-q').textContent=caso.q;
  $('passi').innerHTML=caso.passi.map((_,j)=>`<span class="${j===passo?'on':''}" data-j="${j}">${j+1}</span>`).join('');
  $('passi').querySelectorAll('span').forEach(s=>s.onclick=()=>apriCaso(k,+s.dataset.j));
  $('prev').disabled=k===0&&passo===0;$('next').disabled=k===CASI.length-1&&passo===caso.passi.length-1;
  $('prev').textContent=passo===0?'← Domanda precedente':'← Passo precedente';
  $('next').textContent=passo===caso.passi.length-1?'Prossima domanda →':'Passo successivo →';
  render();
}
function setMode(m){
  if(m===S.mode)return;
  $('modi').querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.m===m));
  $('h-esplora').hidden=$('t-esplora').hidden=m!=='esplora';$('h-casi').hidden=$('t-caso').hidden=m!=='casi';
  if(m==='casi'){salvato={ds:S.ds,v:S.v,view:S.view,xv:S.xv,met:new Set(S.met),hl:S.hl};S.mode='casi';apriCaso(S.caso,S.passo);}
  else{S.mode='esplora';Object.assign(S,salvato||{});S.pin=-1;dsSel.value=S.ds;fillVars();drawTabs();render();}
}
$('modi').querySelectorAll('a').forEach(a=>a.onclick=()=>setMode(a.dataset.m));

function go(d){
  if(S.mode==='esplora'){const vs=DS[S.ds].viste,i=vs.indexOf(S.view)+d;if(i>=0&&i<vs.length){S.view=vs[i];drawTabs();render();}return;}
  const caso=CASI[S.caso],j=S.passo+d;
  if(j>=0&&j<caso.passi.length)apriCaso(S.caso,j);
  else if(d>0&&S.caso<CASI.length-1)apriCaso(S.caso+1,0);
  else if(d<0&&S.caso>0)apriCaso(S.caso-1,CASI[S.caso-1].passi.length-1);
}
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
fillVars();drawTabs();render();
if(location.hash==='#casi')setMode('casi');

// dentro il sito la pagina sta in un iframe: gli dice quanto è alta
if(window.parent!==window&&window.ResizeObserver)new ResizeObserver(()=>parent.postMessage({esplorazione:document.body.scrollHeight},'*')).observe(document.body);
</script>
</body></html>
