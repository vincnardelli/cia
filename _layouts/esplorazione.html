---
layout: default
---
<div class="esplorazione">
  <div class="modulo__kicker"><span class="tag">Esplorazione · modulo {{ page.modulo }}</span></div>
  <h1>{{ page.title }}</h1>
  <p class="modulo__idea">{{ page.question }}</p>
  {% if page.ready %}
  <iframe class="espl-frame"{% if page.altezza %} style="height: {{ page.altezza }}px"{% endif %} src="{{ site.baseurl }}/esplorazioni/{{ page.slug }}.html" title="{{ page.title }}" allow="fullscreen" allowfullscreen></iframe>
  <script>
    window.addEventListener('message', function (e) {
      var f = document.querySelector('.espl-frame');
      if (f && e.source === f.contentWindow && e.data && e.data.esplorazione) f.style.height = (e.data.esplorazione + 2) + 'px';
    });
  </script>
  {% else %}
  <div class="via"><div class="via__k">In arrivo</div>Questa esplorazione sarà pubblicata con il modulo {{ page.modulo }}.</div>
  {% endif %}
  {{ content }}
</div>
